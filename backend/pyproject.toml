[project]
name = "llamatop-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psutil>=6.0",
  "pydantic>=2.8",
  "nvidia-ml-py>=12.560",
]

[project.scripts]
llamatop-agent = "app.agent:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "respx>=0.21"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
