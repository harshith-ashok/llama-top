name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
      - name: Build and start the stack
        env:
          DEFAULT_OLLAMA_URL: ""
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/ | grep -qi "<div id=\"root\">"
          curl -fsS http://localhost:3000/api/health
          curl -fsS -X POST http://localhost:3000/api/sources \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","type":"ollama","base_url":"http://127.0.0.1:9"}' | grep -q '"status":"offline"'
          # Local host sampler should have reported at least once.
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/hosts | grep -q '"id":"local"' && exit 0
            sleep 2
          done
          echo "host sampler never reported" && exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
